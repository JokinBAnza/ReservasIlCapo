version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reservas-app
    container_name: reservas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - reservas-net

  web:
    image: nginx:alpine
    container_name: reservas-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - reservas-net

  db:
    image: mysql:8.0
    container_name: reservas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reservas
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - reservas-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservas-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"            # se accede desde navegador en localhost:8081
    environment:
      PMA_HOST: db           # se conecta al contenedor db
      PMA_PORT: 3306
    networks:
      - reservas-net

networks:
  reservas-net:
    driver: bridge

volumes:
  dbdata: